<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report | Aqua Link</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="report"><div data-app>
<section class="page-head"><div class="eyebrow">FIELD REPORT • AQUA-01</div><h1>Report water waste.</h1><p>See it. Record it. Send it to the school water team.</p></section>
<form id="reportForm" class="panel form">
<label>Problem type<select name="type" required><option value="">Choose one</option><option>Leaking tap</option><option>Running toilet</option><option>Broken pipe</option><option>Overflowing tank</option><option>Other</option></select></label>
<label>Location<select name="location" required><option value="">Choose a school location</option><option>Block D • Ground floor</option><option>Block E • Girls bathroom</option><option>Block G</option><option>Block F</option><option>Block H</option><option>Block I</option><option>HALL</option><option>SPORTS FIELD</option></select></label>
<label>What did you observe?<textarea name="note" rows="5" placeholder="Describe what is happening..." required></textarea></label>
<div class="notice">📍 Prototype reports are stored in this browser and appear in Reports and on the Water Map.</div>
<button class="btn primary" type="submit">Submit report →</button>
</form></div><script src="app.js"></script></body></html>
